name: Quality checks

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check timezone independence
        run: TZ=America/Los_Angeles node --test tests/study-date.test.mjs tests/study-day-subscription.test.mjs tests/vocabulary-merge.test.mjs
      - run: npm run build
      - name: Audit versioned assets and cache boundaries
        run: npm run performance:audit
      - name: Validate Worker bundle without deploying
        run: npx --no-install wrangler deploy --dry-run
      - name: Install browser for production smoke tests
        run: npx --no-install playwright install --with-deps chromium
      - name: Check browser flows and PWA upgrades
        run: npm run test:browser
        timeout-minutes: 10
      - name: Save browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            output/browser-ci/*.json
            output/browser-ci/*.png
            output/browser-ci/*.zip
          if-no-files-found: ignore
          retention-days: 7
